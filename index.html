data:text/html,<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>3D Minecraft</title><style>body,html{margin:0;padding:0;overflow:hidden;width:100%;height:100%;background:#7ec0ee}canvas{display:block}#c{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:20px;user-select:none;pointer-events:none}#i{position:absolute;top:20px;left:20px;background:rgba(0,0,0,.6);color:#fff;padding:15px;border-radius:8px;font-size:14px;pointer-events:none;font-family:sans-serif}</style><script src="https://cloudflare.com"></script><script src="https://jsdelivr.net"></script></head><body><div id="c">+</div><div id="i"><h3 style="margin:0 0 10px;color:#4caf50">🌱 Web Minecraft</h3><b>Click screen to play</b><br><br>• W,A,S,D: Move<br>• Mouse: Look<br>• Esc: Exit</div><script>const scene=new THREE.Scene();scene.background=new THREE.Color(0xbfd1e5);scene.fog=new THREE.FogExp2(0xbfd1e5,.025);const camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,.1,1000);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(window.innerWidth,window.innerHeight);document.body.appendChild(renderer.domElement);scene.add(new THREE.AmbientLight(0xffffff,.6));const dirLight=new THREE.DirectionalLight(0xffffff,.8);dirLight.position.set(20,40,20);scene.add(dirLight);const controls=new THREE.PointerLockControls(camera,document.body);document.body.addEventListener('click',()=>controls.lock());controls.addEventListener('lock',()=>document.getElementById('i').style.display='none');controls.addEventListener('unlock',()=>document.getElementById('i').style.display='block');const worldSize=40,waterLevel=2;const materials={grass:new THREE.MeshLambertMaterial({color:0x557a2b}),dirt:new THREE.MeshLambertMaterial({color:0x866043}),wood:new THREE.MeshLambertMaterial({color:0x735135}),leaves:new THREE.MeshLambertMaterial({color:0x3b5e2b,transparent:true,opacity:.95}),flowerRed:new THREE.MeshLambertMaterial({color:0xe63946}),flowerYellow:new THREE.MeshLambertMaterial({color:0xffb703}),stem:new THREE.MeshLambertMaterial({color:0x38b000})};const blockGeom=new THREE.BoxGeometry(1,1,1),meshes={};Object.keys(materials).forEach(k=>{meshes[k]=new THREE.InstancedMesh(blockGeom,materials[k],20000);meshes[k].count=0;scene.add(meshes[k])});function addB(t,x,y,z){const m=meshes[t];if(!m)return;const d=new THREE.Object3D();d.position.set(x,y,z);d.updateMatrix();m.setMatrixAt(m.count,d.matrix);m.count++}function getH(x,z){return Math.floor(Math.sin(x*.1)*Math.cos(z*.1)*3+Math.sin(x*.05)*2+5)}for(let x=0;x<worldSize;x++){for(let z=0;z<worldSize;z++){const sy=getH(x,z);if(sy<waterLevel){addB('dirt',x,sy,z)}else{addB('grass',x,sy,z)}for(let y=sy-1;y>=0;y--)addB('dirt',x,y,z);if(sy>=waterLevel){const r=Math.random();if(r<.02&&x>2&&x<worldSize-2&&z>2&&z<worldSize-2){const th=3+Math.floor(Math.random()*2);for(let ty=1;ty<=th;ty++)addB('wood',x,sy+ty,z);for(let lx=-2;lx<=2;lx++)for(let lz=-2;lz<=2;lz++)for(let ly=0;ly<=2;ly++){if(Math.abs(lx)===2&&Math.abs(lz)===2&&ly===2)continue;if(lx===0&&lz===0&&ly<th-2)continue;addB('leaves',x+lx,sy+th+ly,z+lz)}}else if(r<.08){const fc=Math.random()>.05?'flowerRed':'flowerYellow';addB('stem',x,sy+1,z);addB(fc,x,sy+2,z)}}}}Object.keys(meshes).forEach(k=>meshes[k].instanceMatrix.needsUpdate=true);const waterGeom=new THREE.PlaneGeometry(worldSize*2,worldSize*2,32,32),waterMat=new THREE.MeshLambertMaterial({color:0x0077be,transparent:true,opacity:.6,side:THREE.DoubleSide}),water=new THREE.Mesh(waterGeom,waterMat);water.rotation.x=-Math.PI/2;water.position.set(worldSize/2,waterLevel-.1,worldSize/2);scene.add(water);camera.position.set(worldSize/2,getH(worldSize/2,worldSize/2)+3,worldSize/2);const move={f:false,b:false,l:false,r:false},vel=new THREE.Vector3(),dir=new THREE.Vector3(),clock=new THREE.Clock();document.addEventListener('keydown',e=>{if(e.code==='KeyW'||e.code==='ArrowUp')move.f=true;if(e.code==='KeyA'||e.code==='ArrowLeft')move.l=true;if(e.code==='KeyS'||e.code==='ArrowDown')move.b=true;if(e.code==='KeyD'||e.code==='ArrowRight')move.r=true});document.addEventListener('keyup',e=>{if(e.code==='KeyW'||e.code==='ArrowUp')move.f=false;if(e.code==='KeyA'||e.code==='ArrowLeft')move.l=false;if(e.code==='KeyS'||e.code==='ArrowDown')move.b=false;if(e.code==='KeyD'||e.code==='ArrowRight')move.r=false});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight)});function anim(){requestAnimationFrame(anim);const dt=clock.getDelta(),t=clock.getElapsedTime(),pos=water.geometry.attributes.position;for(let i=0;i<pos.count;i++){pos.setZ(i,Math.sin(pos.getX(i)*.5+t*1.5)*.08+Math.cos(pos.getY(i)*.5+t*1.5)*.08)}water.geometry.attributes.position.needsUpdate=true;if(controls.isLocked){vel.x-=vel.x*10*dt;vel.z-=vel.z*10*dt;dir.z=Number(move.f)-Number(move.b);dir.x=Number(move.r)-Number(move.l);dir.normalize();if(move.f||move.b)vel.z-=dir.z*12*dt;if(move.l||move.r)vel.x-=dir.x*12*dt;controls.moveRight(-vel.x*dt);controls.moveForward(-vel.z*dt);const px=Math.floor(camera.position.x),pz=Math.floor(camera.position.z);if(px>=0&&px<worldSize&&pz>=0&&pz<worldSize){camera.position.y+=(getH(px,pz)+2-camera.position.y)*.1}}renderer.render(scene,camera)}anim();</script></body></html>
